<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel AI</title>
    <!-- Prevent FOUC (Flash of Unstyled Content) by setting theme instantly -->
    <script>
        if (localStorage.getItem('sentinel_theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        main: 'var(--bg-main)',
                        chat: 'var(--bg-chat)',
                        user: 'var(--bg-user)',
                        sidebar: 'var(--bg-sidebar)',
                        tmain: 'var(--text-main)',
                        tmuted: 'var(--text-muted)',
                        bmain: 'var(--border-main)',
                        accent: '#ff4b4b'
                    }
                }
            }
        }
    </script>
    <!-- Use marked.js to render markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* CSS Variables for Light/Dark Mode */
        :root {
            --bg-main: #f9fafb;
            --bg-sidebar: #f3f4f6;
            --bg-chat: #ffffff;
            --bg-user: #e5e7eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-main: #e5e7eb;
        }

        .dark {
            --bg-main: #0f0f11;
            --bg-sidebar: #18181f;
            --bg-chat: #1e1e24;
            --bg-user: #2a2a36;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-main: #1f2937;
        }

        /* Essential Markdown styling for parsed content */
        .markdown-body pre { background-color: #111; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body code { background-color: #111; color: #e5e7eb; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; }
        .markdown-body p { margin-bottom: 0.75rem; color: var(--text-main); }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; color: var(--text-main); }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; color: var(--text-main); }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--text-main); font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--bg-user); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body class="bg-main text-tmain font-sans h-screen flex m-0 p-0 overflow-hidden transition-colors duration-200">

    <!-- Sidebar -->
    <div class="w-64 bg-sidebar border-r border-bmain flex flex-col z-20 hidden md:flex transition-colors duration-200">
        <div class="p-4 border-b border-bmain">
            <button id="new-chat-btn" class="w-full bg-accent hover:bg-red-500 text-white font-bold py-2 px-4 rounded transition-colors shadow flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                New Chat
            </button>
        </div>
        <div id="sidebar-sessions" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1">
            <!-- Session links injected here -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-screen relative">
        <!-- Header -->
        <div class="w-full p-4 bg-chat border-b border-bmain flex items-center justify-between shadow-md z-10 transition-colors duration-200">
            <div class="flex items-center gap-4">
                <!-- Mobile Menu Toggle -->
                <button id="mobile-menu-btn" class="md:hidden text-tmuted hover:text-tmain">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h2 class="text-xl font-bold tracking-wide">🤖 Sentinel AI <span class="text-xs text-tmuted font-normal ml-2 hidden sm:inline">(SWE-Agent)</span></h2>
            </div>
            
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="p-2 rounded-full bg-user text-tmain hover:bg-main transition-colors shadow-sm" title="Toggle Light/Dark Mode">
                <!-- Sun Icon -->
                <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Moon Icon -->
                <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                </svg>
            </button>
        </div>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-6">
            <!-- Messages will be injected here -->
        </div>

        <!-- Input Area -->
        <div class="w-full p-4 bg-main border-t border-bmain flex gap-4 items-end z-10 transition-colors duration-200">
            <textarea 
                id="prompt-input" 
                rows="1" 
                class="flex-1 bg-chat text-tmain border border-bmain rounded-lg p-3 text-base resize-none focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors max-h-[200px] overflow-y-auto"
                placeholder="How can I help you build today? (Shift+Enter for new line)"></textarea>
            
            <button id="send-btn" class="bg-accent hover:bg-red-500 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-lg">
                Send
            </button>
            <button id="stop-btn" class="hidden bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-lg">
                Stop
            </button>
        </div>
    </div>

    <!-- Mobile Sidebar Overlay (hidden by default) -->
    <div id="mobile-sidebar" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden flex">
        <div class="w-64 bg-sidebar h-full shadow-xl flex flex-col">
            <div class="p-4 border-b border-bmain flex justify-between items-center">
                <button id="mobile-new-chat-btn" class="bg-accent hover:bg-red-500 text-white font-bold py-2 px-4 rounded transition-colors shadow flex items-center justify-center gap-2 flex-1">
                    New Chat
                </button>
                <button id="close-mobile-menu" class="ml-4 text-tmuted hover:text-tmain">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="mobile-sidebar-sessions" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1"></div>
        </div>
        <div class="flex-1" id="mobile-sidebar-backdrop"></div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const sidebarSessions = document.getElementById('sidebar-sessions');
        const mobileSidebarSessions = document.getElementById('mobile-sidebar-sessions');
        
        let currentSessionId = localStorage.getItem('sentinel_session_id');

        // Theme Toggle Logic
        const themeBtn = document.getElementById('theme-toggle');
        const iconLight = document.getElementById('theme-icon-light');
        const iconDark = document.getElementById('theme-icon-dark');
        
        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                iconDark.classList.remove('hidden');
                iconLight.classList.add('hidden');
            } else {
                iconLight.classList.remove('hidden');
                iconDark.classList.add('hidden');
            }
        }
        updateThemeIcons();

        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('sentinel_theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        });

        // Mobile Menu Logic
        document.getElementById('mobile-menu-btn').onclick = () => document.getElementById('mobile-sidebar').classList.remove('hidden');
        document.getElementById('close-mobile-menu').onclick = () => document.getElementById('mobile-sidebar').classList.add('hidden');
        document.getElementById('mobile-sidebar-backdrop').onclick = () => document.getElementById('mobile-sidebar').classList.add('hidden');

        // Auto-resize textarea
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', stopGeneration);
        document.getElementById('new-chat-btn').addEventListener('click', createNewChat);
        document.getElementById('mobile-new-chat-btn').addEventListener('click', () => { createNewChat(); document.getElementById('mobile-sidebar').classList.add('hidden'); });

        async function init() {
            await loadSidebar();
            if (!currentSessionId) {
                await createNewChat();
            } else {
                await loadHistory(currentSessionId);
            }
        }

        async function createNewChat() {
            const res = await fetch('/sessions', { method: 'POST' });
            const data = await res.json();
            currentSessionId = data.id;
            localStorage.setItem('sentinel_session_id', currentSessionId);
            await loadSidebar();
            await loadHistory(currentSessionId);
        }

        async function loadSidebar() {
            const res = await fetch('/sessions');
            const data = await res.json();
            
            const renderLinks = (container) => {
                container.innerHTML = '';
                data.sessions.forEach(session => {
                    const wrapper = document.createElement('div');
                    // Use CSS variables for sidebar hover states
                    wrapper.className = `group relative flex items-center w-full px-3 py-3 rounded text-sm transition-colors ${session.id === currentSessionId ? 'bg-user text-tmain' : 'text-tmuted hover:bg-user hover:text-tmain'}`;
                    
                    const titleContainer = document.createElement('div');
                    titleContainer.className = 'flex-1 truncate cursor-pointer pr-12';
                    titleContainer.innerText = (session.pinned ? '📌 ' : '') + session.title;
                    titleContainer.onclick = () => {
                        currentSessionId = session.id;
                        localStorage.setItem('sentinel_session_id', currentSessionId);
                        loadSidebar(); 
                        loadHistory(currentSessionId);
                        document.getElementById('mobile-sidebar').classList.add('hidden');
                    };

                    const actionMenu = document.createElement('div');
                    actionMenu.className = 'absolute right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-user px-1 rounded shadow-sm';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'text-tmuted hover:text-tmain';
                    editBtn.innerHTML = '✏️';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'bg-chat text-tmain px-2 py-1 rounded outline-none absolute left-2 right-12 z-10 border border-bmain';
                        input.value = session.title;
                        input.onkeydown = async (ev) => {
                            if (ev.key === 'Enter') {
                                ev.stopPropagation();
                                const newTitle = input.value.trim() || 'Untitled';
                                await fetch(`/sessions/${session.id}/title`, {
                                    method: 'PUT',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({title: newTitle})
                                });
                                loadSidebar();
                            } else if (ev.key === 'Escape') {
                                loadSidebar();
                            }
                        };
                        input.onblur = () => loadSidebar();
                        wrapper.appendChild(input);
                        input.focus();
                    };

                    const pinBtn = document.createElement('button');
                    pinBtn.className = 'text-tmuted hover:text-tmain';
                    pinBtn.innerHTML = session.pinned ? '📍' : '📌';
                    pinBtn.onclick = async (e) => {
                        e.stopPropagation();
                        await fetch(`/sessions/${session.id}/pin`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({pinned: !session.pinned})
                        });
                        loadSidebar();
                    };

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'text-tmuted hover:text-red-500';
                    deleteBtn.innerHTML = '🗑️';
                    deleteBtn.onclick = async (e) => {
                        e.stopPropagation();
                        if (confirm(`Are you sure you want to delete "${session.title}"?`)) {
                            await fetch(`/sessions/${session.id}`, { method: 'DELETE' });
                            if (currentSessionId === session.id) {
                                currentSessionId = null;
                                localStorage.removeItem('sentinel_session_id');
                                init(); // load a new chat
                            } else {
                                loadSidebar();
                            }
                        }
                    };

                    actionMenu.appendChild(editBtn);
                    actionMenu.appendChild(pinBtn);
                    actionMenu.appendChild(deleteBtn);
                    wrapper.appendChild(titleContainer);
                    wrapper.appendChild(actionMenu);
                    container.appendChild(wrapper);
                });
            };
            
            renderLinks(sidebarSessions);
            renderLinks(mobileSidebarSessions);
        }

        async function loadHistory(sessionId) {
            chatContainer.innerHTML = ''; // clear chat
            const res = await fetch(`/history/${sessionId}`);
            if (res.status === 404) {
                await createNewChat();
                return;
            }
            const data = await res.json();
            data.messages.forEach(msg => appendMessage(msg.role, msg.content));
        }

        function addCopyButtons(el) {
            el.querySelectorAll('pre').forEach(pre => {
                if (pre.parentNode.classList.contains('relative')) return;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'relative group my-2';
                
                const btn = document.createElement('button');
                btn.className = 'absolute top-2 right-2 bg-gray-700 hover:bg-gray-600 text-xs text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity z-10 cursor-pointer';
                btn.innerText = 'Copy';
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.innerText);
                    btn.innerText = 'Copied!';
                    setTimeout(() => btn.innerText = 'Copy', 2000);
                };
                
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(btn);
                wrapper.appendChild(pre);
            });
        }

        function createMessageBubble(role) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col gap-1 max-w-[85%] md:max-w-[75%] group ${role === 'user' ? 'self-end' : 'self-start w-full'}`;
            
            const msgDiv = document.createElement('div');
            // Use CSS variables for bubble backgrounds
            msgDiv.className = `p-4 rounded-xl leading-relaxed markdown-body shadow-sm ${role === 'user' ? 'bg-user text-tmain' : 'bg-chat border border-bmain text-tmain w-full'}`;
            
            wrapper.appendChild(msgDiv);
            
            const actionBar = document.createElement('div');
            actionBar.className = `flex gap-2 px-2 mt-1 ${role === 'user' ? 'hidden' : 'opacity-0 group-hover:opacity-100 transition-opacity'}`;
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'text-tmuted hover:text-tmain text-xs flex items-center gap-1 transition-colors';
            copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg> <span>Copy Response</span>`;
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(msgDiv.innerText);
                copyBtn.querySelector('span').innerText = 'Copied!';
                setTimeout(() => copyBtn.querySelector('span').innerText = 'Copy Response', 2000);
            };
            
            actionBar.appendChild(copyBtn);
            wrapper.appendChild(actionBar);
            
            return { wrapper, msgDiv };
        }

        function appendMessage(role, content) {
            const bubble = createMessageBubble(role);
            bubble.msgDiv.innerHTML = marked.parse(content);
            addCopyButtons(bubble.msgDiv);
            chatContainer.appendChild(bubble.wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            promptInput.value = '';
            promptInput.style.height = 'auto';
            
            appendMessage('user', prompt);
            
            sendBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            
            const bubble = createMessageBubble('assistant');
            
            // Create the Collapsible Status Menu
            const statusWrapper = document.createElement('details');
            statusWrapper.className = "text-tmuted text-xs mb-3 font-mono cursor-pointer bg-main rounded p-2 border border-bmain transition-colors";
            statusWrapper.innerHTML = "<summary class='outline-none font-bold select-none'>⚙️ Agent Working...</summary><div class='mt-2 flex flex-col gap-1 pl-4 border-l border-tmuted text-xs' id='tool-log-container'><span class='animate-pulse'>💭 Thinking...</span></div>";
            
            // Create the actual markdown content container
            const contentWrapper = document.createElement('div');
            
            bubble.msgDiv.innerHTML = "";
            bubble.msgDiv.appendChild(statusWrapper);
            bubble.msgDiv.appendChild(contentWrapper);
            
            chatContainer.appendChild(bubble.wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            const logContainer = statusWrapper.querySelector('#tool-log-container');
            
            let fullResponse = "";

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt, session_id: currentSessionId})
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, {stream: true});
                    const lines = chunk.split('\n\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                statusWrapper.open = false; // Collapse when finished
                                break;
                            } else if (data === '[STOPPED BY USER]') {
                                statusWrapper.open = false;
                                fullResponse += "\n\n*[Stopped by user]*";
                            } else {
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.tool) {
                                        statusWrapper.open = true; // Pop open to show work
                                        const toolEntry = document.createElement('span');
                                        toolEntry.innerText = `🛠️ Using tool: ${parsed.tool}...`;
                                        logContainer.appendChild(toolEntry);
                                        chatContainer.scrollTop = chatContainer.scrollHeight;
                                    }
                                    if (parsed.text) fullResponse += parsed.text;
                                    if (parsed.error) fullResponse += `\n\n**Error:** ${parsed.error}`;
                                } catch (e) {}
                            }
                            
                            if (fullResponse) {
                                contentWrapper.innerHTML = marked.parse(fullResponse);
                                addCopyButtons(contentWrapper);
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }
                    }
                }
                loadSidebar();
            } catch (e) {
                contentWrapper.innerHTML += `<br><span class="text-red-500 font-bold">Connection error: ${e.message}</span>`;
            } finally {
                sendBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
            }
        }

        async function stopGeneration() {
            await fetch('/stop', { method: 'POST' });
        }

        init();
    </script>
</body>
</html>
